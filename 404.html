    <!--
      Self-hosted Plus Jakarta Sans (AC-01). The @font-face rules live HERE,
      not in theme/variables.css, because the font files stay in public/ (so
      the preloads above hit the exact same stable URLs) and a root-absolute
      url() inside bundled CSS is NOT rebased by Vite's `base` — under the
      presenter-domain /elearning/ base path those would 404. /aha-elearning-preview/ is
      substituted by Vite in HTML only.

      AHA-42513: both `latin` and `vietnamese` subsets are declared with
      explicit unicode-range (values copied verbatim from Google Fonts'
      official CSS for PJS) so Vietnamese diacritics like ề/ấ/ạ use the
      Vietnamese subset instead of falling back to the system serif.
    -->

        font-family: 'Plus Jakarta Sans';

        font-display: swap;
        src: url('/aha-elearning-preview/fonts/plus-jakarta-sans/plus-jakarta-sans-vietnamese-200-normal.woff2') format('woff2');

          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
